# =============================================================================
# ushbooknpay — docker-compose.yml (DEVELOPMENT)
# For production use: docker compose -f docker-compose.prod.yml up --build -d
#                 OR: ./start-prod.sh
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ushbooknpay
    restart: unless-stopped
    ports:
      - "8003:8003"
    expose:
      - "8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    networks:
      - ushspa-network
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload --loop uvloop --http httptools
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8003/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ushspa-network:
    external: true
    