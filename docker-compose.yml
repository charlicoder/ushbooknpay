version: "3.9"

services:
  ushbooknpay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ushbooknpay
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8003/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
